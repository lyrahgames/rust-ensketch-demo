[workspace]
resolver = "2"
members = ["crates/engine", "crates/script-lua", "crates/script-rhai", "crates/script-python", "crates/script-js", "apps/native", "apps/web"]
default-members = ["crates/engine", "apps/native"]

[workspace.dependencies]
engine = { path = "crates/engine" }
wgpu = "30.0.1"
winit = "0.30.13"
glam = "0.34.1"
tobj = "4.0.5"
bytemuck = { version = "1.25.2", features = ["derive"] }
pollster = "0.4.0"
futures-channel = "0.3.34"
mlua = { version = "0.12.2", features = ["lua54", "vendored"] }
rhai = "1.27.0"
pyo3 = { version = "0.30.1", features = ["extension-module"] }
wasm-bindgen = "0.2.128"
js-sys = "0.3.105"
web-sys = "0.3.105"
wasm-bindgen-futures = "0.4.55"

